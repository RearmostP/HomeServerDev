<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>גלריית הבית</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main id="auth" class="auth">
    <form id="credentials">
      <h1>גלריית הבית</h1>
      <label>שם משתמש<input name="username" autocomplete="username" required pattern="[a-z][a-z0-9_]{2,23}"></label>
      <label id="email-field" hidden>מייל<input name="email" type="email" autocomplete="email"></label>
      <label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label>
      <button id="submit-auth" class="primary">כניסה</button>
      <button type="button" id="toggle-auth">יצירת חשבון</button>
    </form>
  </main>
  <div id="gallery" class="layout" hidden>
    <aside>
      <strong>גלריית הבית</strong>
      <nav aria-label="גלריה">
        <button data-tab="photos" aria-current="page">תמונות</button>
        <button data-tab="albums">אלבומים</button>
        <button data-tab="shared">משותפים</button>
        <button data-tab="devices">מכשירים</button>
      </nav>
      <button id="logout">יציאה</button>
    </aside>
    <main class="content">
      <header><div><p id="account"></p><h1 id="title">תמונות</h1></div>
        <div id="actions">
          <button id="new-album" hidden>אלבום חדש</button>
          <button id="selection" hidden>בחירת תמונות</button>
          <button id="copy-photos" hidden>הוספה לאלבום</button>
          <button id="share" hidden>שיתוף</button>
          <button id="remove-album" hidden>מחיקת אלבום</button>
          <label id="upload" class="primary" hidden>העלאה<input type="file" id="files" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple></label>
        </div>
      </header>
      <section id="items"></section>
    </main>
  </div>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <dialog id="edit"><form id="edit-form">
    <h2 id="edit-title"></h2>
    <label id="edit-label" for="edit-input"></label>
    <input id="edit-input" required>
    <div class="dialog-actions"><button id="cancel-edit" type="button">ביטול</button><button class="primary">שמירה</button></div>
  </form></dialog>
  <dialog id="copy-dialog"><form id="copy-form">
    <h2>הוספה לאלבום</h2>
    <label>אלבום יעד<select id="copy-target" required></select></label>
    <div class="dialog-actions"><button id="cancel-copy" type="button">ביטול</button><button class="primary">הוספה</button></div>
  </form></dialog>
  <dialog id="viewer" aria-label="תצוגת תמונה">
    <button id="close-viewer" aria-label="סגירה">✕</button>
    <button id="previous" aria-label="תמונה קודמת">›</button>
    <img id="full-image" alt="">
    <button id="next" aria-label="תמונה הבאה">‹</button>
  </dialog>
</body>
</html>
